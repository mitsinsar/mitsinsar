name: Snake

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:       # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?color_snake=#ff5fb8&color_dots=#e6e3f5,#c9b8ff,#b78cff,#7f5fd6,#4fe3ff
            dist/snake-neon-dark.svg?color_snake=#ff5fb8&color_dots=#1d1a3d,#3b2a6b,#6b3fa0,#b14fd0,#4fe3ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
